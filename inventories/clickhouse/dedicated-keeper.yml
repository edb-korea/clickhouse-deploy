---
# Three dedicated Keeper nodes plus separate server nodes:
# 2 shards x 2 replicas = 4 servers. Add more server hosts for more shards
# or replicas, the shape is defined by ch_shard / ch_replica of each host.
#
#   ansible-playbook -i inventories/clickhouse/dedicated-keeper.yml clickhouse.yml
#
#   host            role     shard  replica
#   ch-keeper-1..3  keeper
#   ch-server-1     server     1       1
#   ch-server-2     server     1       2
#   ch-server-3     server     2       1
#   ch-server-4     server     2       2
clickhouse_clusters:
  children:
    cluster_ch_prod:
      vars:
        cluster_name: "ch_prod"
        ch_topology: "sharded"
        # ansible_user: rocky
        # ch_default_password: "{{ vault_ch_default_password }}"
        # ch_cluster_secret: "{{ vault_ch_cluster_secret }}"
        # ch_run_smoke_test: true
      hosts:
        ch-keeper-1:
          ansible_host: 10.0.0.31
          ch_roles: [keeper]
          ch_keeper_id: 1
        ch-keeper-2:
          ansible_host: 10.0.0.32
          ch_roles: [keeper]
          ch_keeper_id: 2
        ch-keeper-3:
          ansible_host: 10.0.0.33
          ch_roles: [keeper]
          ch_keeper_id: 3
        ch-server-1:
          ansible_host: 10.0.0.41
          ch_roles: [server]
          ch_shard: 1
          ch_replica: 1
        ch-server-2:
          ansible_host: 10.0.0.42
          ch_roles: [server]
          ch_shard: 1
          ch_replica: 2
        ch-server-3:
          ansible_host: 10.0.0.43
          ch_roles: [server]
          ch_shard: 2
          ch_replica: 1
        ch-server-4:
          ansible_host: 10.0.0.44
          ch_roles: [server]
          ch_shard: 2
          ch_replica: 2
