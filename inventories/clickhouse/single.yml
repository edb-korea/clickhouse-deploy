---
# One ClickHouse server, no Keeper, no cluster definition
#
#   ansible-playbook -i inventories/clickhouse/single.yml clickhouse.yml
clickhouse_clusters:
  children:
    cluster_ch_single:
      vars:
        cluster_name: "ch_single"
        ch_topology: "single"
        # ansible_user: rocky
        # ch_default_password: "{{ vault_ch_default_password }}"
      hosts:
        ch-single-1:
          ansible_host: 10.0.0.11
          ch_roles: [server]
