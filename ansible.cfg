[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
forks = 10
# time in seconds to wait for a connection to a host
timeout = 60

[ssh_connection]
pipelining = True
# remove the "-o StrictHostKeyChecking=no" for production environments
ssh_args = -o ControlMaster=auto -o ControlPersist=10s -o StrictHostKeyChecking=no
