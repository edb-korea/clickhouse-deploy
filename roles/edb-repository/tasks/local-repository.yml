---

- name: Show the local repository in use
  ansible.builtin.debug:
    msg: >-
      No Altinity or EDB repository available (or edb_repository_source is 'local'):
      using {{ edb_local_repo_name }} ({{ edb_local_repo_baseurl }}).

- name: Configure the local repository
  ansible.builtin.yum_repository:
    name: "{{ edb_local_repo_name }}"
    description: "{{ edb_local_repo_description }}"
    baseurl: "{{ edb_local_repo_baseurl }}"
    gpgcheck: "{{ edb_local_repo_gpgcheck }}"
    priority: "{{ edb_local_repo_priority }}"
    enabled: true
  become: true
  become_user: root
  register: _edb_local_repo

- name: Refresh repository
  ansible.builtin.command: yum makecache --repo {{ edb_local_repo_name }}
  become: true
  become_user: root
  changed_when: true
  timeout: 300
  when: _edb_local_repo is changed
  register: _edb_local_refresh
  until: _edb_local_refresh is succeeded
  retries: 10
  delay: 5
